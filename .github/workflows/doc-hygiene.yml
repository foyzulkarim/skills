name: Doc hygiene

on:
  pull_request:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Block branch-only artifacts from master
        run: bash .github/scripts/check-doc-hygiene.sh .
